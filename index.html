<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏀 Barack O'Ballers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
      <div class="setup-header">
        <div class="logo">🏀</div>
        <h1>Barack O'Ballers</h1>
        <p class="subtitle">Select players attending today's game</p>
      </div>
      <div class="setup-controls">
        <button id="select-all-btn" class="btn btn-select-all">Select All</button>
      </div>
      <div class="roster-grid" id="roster-setup"></div>
      <div class="setup-footer">
        <span id="selected-count" class="selected-count">0 players selected</span>
        <button id="start-game-btn" class="btn btn-primary" disabled>Start Game</button>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
      <header class="game-header">
        <div class="header-left">
          <button id="back-btn" class="btn btn-ghost">← Setup</button>
        </div>
        <div class="header-center">
          <div class="game-clock-wrapper">
            <span class="clock-label">GAME CLOCK</span>
            <div class="game-clock" id="game-clock">00:00</div>
          </div>
        </div>
        <div class="header-right">
          <button id="game-timer-btn" class="btn btn-clock" data-state="stopped">▶ Start</button>
          <button id="reset-btn" class="btn btn-ghost">↺ Reset</button>
        </div>
      </header>

      <div class="game-body">
        <!-- Court Section -->
        <section class="court-section">
          <div class="section-label">
            <span class="court-icon">🟢</span>
            <h2>On Court <span id="court-count" class="count-badge">0/5</span></h2>
          </div>
          <div class="players-grid drop-zone" id="court-players" data-zone="court"></div>
        </section>

        <!-- Bench Section -->
        <section class="bench-section">
          <div class="section-label">
            <span class="bench-icon">🪑</span>
            <h2>Bench <span id="bench-count" class="count-badge">0</span></h2>
          </div>
          <div class="players-grid drop-zone" id="bench-players" data-zone="bench"></div>
        </section>
      </div>
    </div>

    <!-- Sub Modal -->
    <div id="sub-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3>Substitution</h3>
          <button id="modal-close" class="btn btn-icon">✕</button>
        </div>
        <p class="modal-subtitle">Subbing out: <strong id="sub-out-name"></strong></p>
        <p class="modal-hint">Select a bench player to sub in:</p>
        <div id="sub-options" class="sub-options"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
